# Continuous integration for TripTrace.ai.
#
# Every command here is the same one used locally, so a green run means the same checks
# that gate a local change also gate a push. No secrets are required: the end-to-end
# suites create their own local D1 and R2 state and their own throwaway accounts, and
# billing is exercised with locally signed webhook payloads rather than a Stripe account.
#
# The order matters: builds first, then the HTTP suites, because those suites run against the
# built worker. See the comments on the steps themselves.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22.6 or newer is required: the unit suites run TypeScript through Node's
          # built-in type stripping rather than a build step.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # `git diff --check` is intentionally not run here. On a clean checkout it compares
      # the working tree to the index and can never fail, so it belongs to the local gate
      # in docs/manual-testing-guide.md rather than to CI.

      - name: Unit tests
        run: npm run test:unit

      # The builds run before the HTTP suites, because the suites exercise the built worker
      # rather than a development server. Running them against `next dev` made them flaky:
      # that server compiles routes on demand and answers 404 with an HTML not-found page for
      # a route it has not compiled yet, which cost roughly half of all cold runs. The built
      # artifact contains every route, and it is the same one that gets deployed.
      - name: Production build
        run: npm run build

      - name: Cloudflare build
        run: npm run cf:build

      # Applies local migrations, serves the built worker through workerd with local D1 and R2
      # bindings, runs the API, privacy, entitlement, billing, export and sharing suites, then
      # removes its test data. It reuses the artifact built above rather than rebuilding.
      - name: HTTP tests
        run: npm run test:e2e

      - name: Confirm no secrets or local state were committed
        run: |
          set -e
          for path in .dev.vars .next .open-next .wrangler; do
            if git ls-files --error-unmatch "$path" > /dev/null 2>&1; then
              echo "::error::$path must never be committed"
              exit 1
            fi
          done
          if git ls-files | grep -E '\.sqlite$' ; then
            echo "::error::local database files must never be committed"
            exit 1
          fi
          echo "No secrets or local state are tracked."
